# starship.toml — o prompt do MeowSystem. NÃO EDITAR À MÃO.
#
# A cópia que vale é `assets/prompt/starship.toml` no repositório; o que está em
# `~/.config/starship.toml` é instalado por `scripts/prompt.sh aplicar` e
# conferido por `scripts/prompt.sh conferir`. Editar o de destino faz o doctor
# acusar divergência todo dia — edite o do repositório e aplique.
#
# ORIGEM, E ELA É AUDITÁVEL
#   Preset OFICIAL `catppuccin-powerline` do starship, baixado em 25/08/2026 de
#     https://starship.rs/presets/toml/catppuccin-powerline.toml
#   sha256 do arquivo baixado, ANTES de qualquer mudança:
#     c23746e4c249035ad02f42886e947643e80bae6643aa4170a3b4713bea5febcb
#   Nada foi desenhado aqui. As quatro mudanças estão nomeadas uma a uma abaixo;
#   todo o resto é o upstream, byte a byte.
#
#   Os 26 hex do flavor mocha foram CONFERIDOS contra `assets/paleta/catppuccin.json`
#   deste repositório: batem os 26, sem uma divergência (o preset escreve em
#   minúsculas e a paleta em maiúsculas — mesmo valor). Por isso este arquivo não
#   é "hex cravado num script": é a mesma paleta, chegando pelo upstream.
#
# AS QUATRO MUDANÇAS, E O PORQUÊ DE CADA UMA
#
#   1. SÓ O FLAVOR MOCHA. O preset traz os quatro (latte, frappe, macchiato,
#      mocha) e usa um. Esta máquina é `FLAVOR="mocha"` no meow.conf, e três
#      paletas que ninguém lê são exatamente o peso morto que este projeto já
#      pagou uma vez — ver o `gato-pop.svg` em docs/FRONTEIRA.md.
#      [09/10/2026, P74 item 7: o arquivo INSTALADO não fica no mocha. O
#      `scripts/prompt.sh` troca a linha `palette` e o bloco `[palettes.*]` lá
#      de baixo pelos 26 slots da paleta do pack no ar, no flavor da máquina
#      (`dracula_dracula` com o Dracula); com o Catppuccin Mocha no ar, sai
#      este arquivo como está.]
#
#   2. O ACCENT É `mauve`, NÃO `red`. O `ACCENT="mauve"` do meow.conf governa o
#      tema inteiro do COSMIC; o prompt entrar em vermelho seria o único lugar da
#      máquina discordando. A troca é só no segmento de CABEÇA (`os` +
#      `username`) e na emenda dele com o `directory`. O resto do arco-íris
#      (peach, yellow, green, sapphire, lavender) é o do upstream, intacto.
#
#      Vem um ganho junto, e ele não é estético: no preset original o `red` é ao
#      mesmo tempo o crachá do usuário e a cor do sinal de erro. Com a cabeça em
#      mauve, vermelho no prompt volta a significar UMA coisa — deu errado.
#
#   3. A LINHA `Pop` DE `[os.symbols]` FOI ACRESCENTADA (U+F32A, nf-linux-pop_os).
#      Medido, não suposto: o preset não lista Pop!_OS, e o `get_symbol` do
#      starship cai no padrão do próprio binário, que é um PIRULITO
#      (`Type::Pop => "<U+1F36D> "`, src/configs/os.rs) — e a JetBrainsMono Nerd
#      Font dela NÃO tem esse codepoint, então viria de outra fonte
#      (src/configs/os.rs, linha 77) — um PIRULITO. E a `JetBrainsMono Nerd Font
#      Mono` dela NÃO tem o U+1F36D: `fc-list :charset=1F36D` devolve só o Noto
#      Color Emoji. Sem esta linha, o primeiro segmento do prompt sai um emoji
#      colorido, de outra fonte, dentro de um retângulo mauve chapado.
#
#      O U+F32A está na fonte dela — conferido com `fc-query -f '%{charset}'`,
#      junto com os outros 44 codepoints não-ASCII deste arquivo: os 44 existem.
#
#   4. `show_notifications = false`. O preset vem com `true` e
#      `min_time_to_notify = 45000`: TODO comando que passasse de 45 s penduraria
#      uma notificação de desktop na TV dela. Isso não é aparência, é
#      comportamento novo que ninguém pediu — e este projeto não instala
#      surpresa. Ligar de volta é trocar esta palavra.
#
# O QUE NÃO FOI MEXIDO, E É DECISÃO DELA (ver assets/prompt/LEIAME.md)
#   O `[time]` desenha um relógio no fim do prompt, e o painel dela já tem um. O
#   `[cmd_duration]` mostra milissegundos. Os dois são gosto, e gosto neste
#   projeto não se decide sozinho: ficaram como o upstream os entrega, com a
#   linha exata para desligar cada um escrita no LEIAME.
#
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](mauve)\
$os\
$username\
[](bg:peach fg:mauve)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_status\
[](fg:yellow bg:green)\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:green bg:sapphire)\
$conda\
[](fg:sapphire bg:lavender)\
$time\
[ ](fg:lavender)\
$cmd_duration\
$line_break\
$character"""

palette = 'catppuccin_mocha'

[os]
disabled = false
style = "bg:mauve fg:crust"

[os.symbols]
Pop = ""
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:mauve fg:crust"
style_root = "bg:mauve fg:crust"
format = '[ $user]($style)'

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'

[nodejs]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[bun]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[c]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[rust]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[golang]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[php]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[java]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[kotlin]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[haskell]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[python]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:green)]($style)'

[docker_context]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol( $context) ](fg:crust bg:sapphire)]($style)'

[conda]
symbol = "  "
style = "fg:crust bg:sapphire"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:lavender"
format = '[[  $time ](fg:crust bg:lavender)]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = "[\u276F](bold fg:green)"
error_symbol = "[\u276F](bold fg:red)"
vimcmd_symbol = "[\u276E](bold fg:green)"
vimcmd_replace_one_symbol = "[\u276E](bold fg:lavender)"
vimcmd_replace_symbol = "[\u276E](bold fg:lavender)"
vimcmd_visual_symbol = "[\u276E](bold fg:yellow)"

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:lavender"
disabled = false
show_notifications = false
min_time_to_notify = 45000

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
