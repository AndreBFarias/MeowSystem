<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeowSystem · Terminal</title>
<link rel="icon" type="image/svg+xml" href="assets/marca.svg">
<script>try{var g=JSON.parse(localStorage.getItem("meow-final")||"{}");if(g.tema)document.documentElement.dataset.tema=g.tema;if(g.destaque)document.documentElement.dataset.destaque=g.destaque}catch(e){}</script>
<link rel="stylesheet" href="estilo.css">
</head>
<body data-porta="ajustes" data-sub="terminal">
<header id="topo"></header>

<main class="pagina">
  <div class="cabeca"><div><h1>Terminal</h1><p>As cores e a linha de comando.</p></div></div>

  <div class="oficina">
    <nav id="trilho" aria-label="Ajustes"></nav>
    <div class="palco"><div class="previa" data-sem="arq" data-ff="coquinha" data-marca="term"></div></div>

    <div class="pilha">
      <section class="bloco">
        <header><h2>Cores</h2></header>
        <ul class="linhas">
          <li class="linha"><div class="rot">Cores do tema no terminal</div><div class="ctl"><button class="chave" role="switch" aria-checked="true" aria-label="Cores do tema no terminal"></button></div></li>
          <li class="linha"><div class="rot">Cor do cursor <span class="q" data-porque="Na cor de destaque, o cursor combina com o resto da máquina. Original devolve a cor que o tema traz."></span></div><div class="ctl"><div class="seg" role="group" aria-label="Cor do cursor"><button type="button" aria-pressed="true">Destaque</button><button type="button">Original do tema</button></div></div></li>
        </ul>
      </section>
      <section class="bloco">
        <header><h2>Linha de comando</h2></header>
        <ul class="linhas">
          <li class="linha"><div class="rot">Linha colorida <span class="q" data-porque="A faixa antes do cursor, com a pasta onde você está e o ramo do git."></span><small>meow · pasta · ramo</small></div><div class="ctl"><button class="chave" role="switch" aria-checked="true" aria-label="Linha colorida"></button></div></li>
        </ul>
      </section>
      <p class="miudo">O gato que abre com o terminal fica em <a href="ajustes-gato.html">Gato</a>.</p>
    </div>
  </div>
</main>

<footer id="rodape"></footer>
<script src="icones-meow.js"></script>
<script src="mockup.js"></script>
</body>
</html>
