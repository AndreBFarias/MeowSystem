<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeowSystem · Criar tema · Papel de parede</title>
<link rel="icon" type="image/svg+xml" href="assets/marca.svg">
<script>try{var g=JSON.parse(localStorage.getItem("meow-final")||"{}");if(g.tema)document.documentElement.dataset.tema=g.tema;if(g.destaque)document.documentElement.dataset.destaque=g.destaque}catch(e){}</script>
<link rel="stylesheet" href="estilo.css">
<style>
.escolhas.papeis .escolha { position: relative; }
.escolhas.papeis .tag { position: absolute; top: 12px; left: 12px; display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: var(--raio-pilula); background: color-mix(in oklab, var(--c-crust) 80%, transparent); color: #F8F8F2; font-size: var(--t-xs); font-weight: 600; }
.escolhas.papeis .tag svg { width: 12px; height: 12px; }
.escolhas.papeis { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
</style>
</head>
<body data-porta="criar" data-passo="papel">
<header id="topo"></header>

<main class="pagina">
  <div class="criar-cabeca">
    <div><label class="sr" for="nome">Nome do tema</label><input class="nome-tema" id="nome" value="Noite de Vitória"><p>a partir do Dracula · guardado agora</p></div>
    <div class="fila"><button class="bt leve" type="button" data-ic="desfazer">Desfazer</button><a class="bt" href="criar-publicar.html" data-ic="enviar">Mandar</a></div>
  </div>
  <ol id="passos"></ol>

  <div class="oficina sem-trilho">
    <div class="palco"><div class="previa" data-pack="dracula" data-sem="arq term"></div>
      <p class="legenda-previa">Clique numa imagem para ver aqui.</p></div>

    <div class="lateral">
      <div class="fila" style="justify-content:space-between"><h2 class="rotulo">13 imagens <span class="q" data-porque="As marcadas com a lua entram à noite. O MeowSystem mede a luz de cada imagem e separa sozinho; clique na etiqueta para mudar."></span></h2>
        <button class="bt pequeno" type="button" data-ic="mais">Trazer imagens</button></div>
      <div class="escolhas papeis" data-grupo>
        <button class="escolha" type="button" data-escolhe aria-pressed="true" data-parede-prev="assets/papeis/eclipse.svg"><img src="assets/papeis/eclipse.svg" alt=""><b class="tag">noite</b><span>Eclipse</span></button>
        <button class="escolha" type="button" data-escolhe data-parede-prev="assets/papeis/mare.svg"><img src="assets/papeis/mare.svg" alt=""><b class="tag">noite</b><span>Maré</span></button>
        <button class="escolha" type="button" data-escolhe data-parede-prev="assets/papeis/velas.svg"><img src="assets/papeis/velas.svg" alt=""><b class="tag">noite</b><span>Velas</span></button>
        <button class="escolha" type="button" data-escolhe data-parede-prev="assets/papeis/vitral.svg"><img src="assets/papeis/vitral.svg" alt=""><span>Vitral</span></button>
        <button class="escolha" type="button" data-escolhe data-parede-prev="assets/papeis/rosacea.svg"><img src="assets/papeis/rosacea.svg" alt=""><span>Rosácea</span></button>
        <button class="escolha" type="button" data-escolhe data-parede-prev="assets/papeis/nave.svg"><img src="assets/papeis/nave.svg" alt=""><span>Nave</span></button>
        <button class="escolha" type="button" data-escolhe data-parede-prev="assets/papeis/agulhas.svg"><img src="assets/papeis/agulhas.svg" alt=""><span>Agulhas</span></button>
        <button class="escolha" type="button" data-escolhe data-parede-prev="assets/papeis/corvo.svg"><img src="assets/papeis/corvo.svg" alt=""><span>Corvo</span></button>
        <button class="escolha" type="button" data-escolhe data-parede-prev="assets/papeis/portao.svg"><img src="assets/papeis/portao.svg" alt=""><span>Portão</span></button>
        <button class="escolha" type="button" data-escolhe data-parede-prev="assets/papeis/camposanto.svg"><img src="assets/papeis/camposanto.svg" alt=""><span>Camposanto</span></button>
        <button class="escolha" type="button" data-escolhe data-parede-prev="assets/papeis/folios.svg"><img src="assets/papeis/folios.svg" alt=""><span>Fólios</span></button>
        <button class="escolha" type="button" data-escolhe data-parede-prev="assets/papeis/espinhos.svg"><img src="assets/papeis/espinhos.svg" alt=""><span>Espinhos</span></button>
        <button class="escolha" type="button" data-escolhe data-parede-prev="assets/papeis/filigrana.svg"><img src="assets/papeis/filigrana.svg" alt=""><span>Filigrana</span></button>
      </div>
      <div class="solte"><svg class="i" viewBox="0 0 24 24"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></svg><div><strong>Solte imagens aqui</strong>.png, .jpg ou .svg, do tamanho da tela.</div></div>
      <div class="seguir"><a class="bt leve" href="criar-icones.html">Voltar</a><a class="bt principal" href="criar-sons.html">Próximo: sons</a></div>
    </div>
  </div>
</main>

<footer id="rodape"></footer>
<script src="icones-meow.js"></script>
<script src="mockup.js"></script>
</body>
</html>
