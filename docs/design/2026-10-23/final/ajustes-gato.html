<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeowSystem · Mascote</title>
<link rel="icon" type="image/svg+xml" href="assets/marca.svg">
<script>try{var g=JSON.parse(localStorage.getItem("meow-final")||"{}");if(g.tema)document.documentElement.dataset.tema=g.tema;if(g.destaque)document.documentElement.dataset.destaque=g.destaque}catch(e){}</script>
<link rel="stylesheet" href="estilo.css">
<style>
.dia-noite { display: inline-flex; gap: var(--e-2); }
.dia-noite .escolha { grid-template-columns: auto auto auto; align-items: center; padding: 6px 12px 6px 6px; }
.dia-noite img { width: 32px; height: 32px; }
.dia-noite svg.i { color: var(--tinta-3); }
</style>
</head>
<body data-porta="ajustes" data-sub="gato">
<header id="topo"></header>

<main class="pagina">
  <div class="cabeca"><div><h1>Mascote</h1><p>O mascote da dock e do terminal.</p></div></div>

  <div class="oficina">
    <nav id="trilho" aria-label="Ajustes"></nav>
    <div class="palco"><div class="previa" data-sem="arq" data-ff="coquinha" data-marca="dock term"></div>
      <p class="legenda-previa"><i></i>O mascote aparece aqui e no terminal.</p></div>

    <div class="pilha">
      <section class="bloco">
        <header><h2>Na dock</h2></header>
        <div class="corpo">
          <div class="escolhas" data-grupo aria-label="Gato da dock">
            <button class="escolha" type="button" data-escolhe aria-pressed="true" data-gato-prev="coquinha"><img src="packs/meowsystem/mascote/coquinha.svg" alt="">Coquinha</button>
            <button class="escolha" type="button" data-escolhe data-gato-prev="mimir"><img src="packs/meowsystem/mascote/mimir.svg" alt="">Mimir</button>
            <button class="escolha" type="button" data-escolhe data-gato-prev="morcego"><img src="packs/meowsystem/mascote/morcego.svg" alt="">Morcego</button>
            <button class="escolha" type="button" data-ic="mais" style="border-style:dashed">Trazer um .svg</button>
          </div>
        </div>
        <ul class="linhas">
          <li class="linha"><div class="rot">Muda com a hora <span class="q" data-porque="Um gato de dia e outro de noite. O horário é o de Dia e noite."></span></div><div class="ctl"><button class="chave" role="switch" aria-checked="true" aria-label="Muda com a hora"></button></div></li>
          <li class="linha sub"><div class="rot">De dia e de noite</div><div class="ctl"><div class="dia-noite">
            <button class="escolha" type="button"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><img src="packs/meowsystem/mascote/mimir.svg" alt="">Mimir</button>
            <button class="escolha" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg><img src="packs/meowsystem/mascote/coquinha.svg" alt="">Coquinha</button></div></div></li>
          <li class="linha"><div class="rot">Girar por todos os mascotes</div><div class="ctl"><button class="chave" role="switch" aria-checked="false" aria-label="Girar por todos os gatos"></button></div></li>
        </ul>
      </section>

      <section class="bloco">
        <header><h2>No terminal</h2></header>
        <ul class="linhas">
          <li class="linha"><div class="rot">Mascote ao abrir o terminal</div><div class="ctl"><button class="chave" role="switch" aria-checked="true" aria-label="Gato ao abrir o terminal"></button></div></li>
          <li class="linha sub"><div class="rot">Qual</div><div class="ctl"><div class="seg" role="group" aria-label="Qual gato no terminal"><button type="button" aria-pressed="true">O mesmo da dock</button><button type="button">Segue a hora</button><button type="button">Sempre o mesmo</button></div></div></li>
          <li class="linha sub"><div class="rot">Tamanho</div><div class="ctl" style="width:260px"><div class="faixa de-fabrica"><input type="range" min="20" max="80" value="40" aria-label="Tamanho do gato no terminal" data-un="col."><output>padrão</output></div></div></li>
        </ul>
      </section>
    </div>
  </div>
</main>

<footer id="rodape"></footer>
<script src="icones-meow.js"></script>
<script src="mockup.js"></script>
</body>
</html>
