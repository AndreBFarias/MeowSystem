<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeowSystem · Janelas e tela</title>
<link rel="icon" type="image/svg+xml" href="assets/marca.svg">
<script>try{var g=JSON.parse(localStorage.getItem("meow-final")||"{}");if(g.tema)document.documentElement.dataset.tema=g.tema;if(g.destaque)document.documentElement.dataset.destaque=g.destaque}catch(e){}</script>
<link rel="stylesheet" href="estilo.css">
<style>
.ponteiro { width: 72px; height: 72px; display: grid; place-items: center; }
.ponteiro svg { width: 40px; height: 40px; }
.areas { display: flex; gap: var(--e-2); flex-wrap: wrap; }
.areas span { display: inline-flex; align-items: center; gap: var(--e-2); height: 36px; padding: 0 var(--e-3); border-radius: var(--raio-md); border: 1px dashed var(--linha-forte); color: var(--tinta-2); }
.areas b { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--cartao-2); color: var(--tinta); font-size: var(--t-xs); }
</style>
</head>
<body data-porta="ajustes" data-sub="janelas">
<header id="topo"></header>

<main class="pagina">
  <div class="cabeca"><div><h1>Janelas e tela</h1><p>Como as janelas se arrumam e o tamanho de tudo.</p></div></div>

  <div class="oficina">
    <nav id="trilho" aria-label="Ajustes"></nav>
    <div class="palco"><div class="previa" data-sem="musica"></div></div>

    <div class="pilha">
      <section class="bloco">
        <header><h2>Janelas</h2></header>
        <ul class="linhas">
          <li class="linha"><div class="rot">Lado a lado <span class="q" data-porque="As janelas se arrumam sozinhas, uma ao lado da outra, sem se cobrir."></span></div><div class="ctl"><button class="chave" role="switch" aria-checked="true" aria-label="Janelas lado a lado"></button></div></li>
          <li class="linha sub"><div class="rot">Vale para</div><div class="ctl"><div class="seg" role="group" aria-label="Vale para"><button type="button" aria-pressed="true">Todas as áreas</button><button type="button">Cada área separada</button></div></div></li>
        </ul>
      </section>

      <section class="bloco">
        <header><h2>Tela</h2></header>
        <ul class="linhas">
          <li class="linha"><div class="rot">Tamanho de tudo <span class="q" data-porque="Automático deixa o sistema escolher pela tela. Os números aumentam letra, ícone e janela juntos."></span></div><div class="ctl"><div class="seg" role="group" aria-label="Tamanho de tudo"><button type="button" aria-pressed="true">Automático</button><button type="button">100%</button><button type="button">125%</button><button type="button">150%</button><button type="button">200%</button></div></div></li>
        </ul>
        <div class="corpo">
          <p class="calmo" style="margin-bottom:var(--e-3)">Ponteiro <span class="q" data-porque="Trocar de tema leva o ponteiro do tema junto. Aqui você escolhe outro, se quiser."></span></p>
          <div class="escolhas" role="group" aria-label="Ponteiro" data-grupo>
            <button class="escolha" type="button" data-escolhe aria-pressed="true"><span class="ponteiro"><svg viewBox="0 0 24 24"><path d="M5 3v16l4.5-4.5 3 6 2.5-1.2-3-6H18Z" fill="var(--c-text)" stroke="var(--c-crust)" stroke-width="1.2" stroke-linejoin="round"/></svg></span>Claro do tema<small>o do pack</small></button>
            <button class="escolha" type="button" data-escolhe><span class="ponteiro"><svg viewBox="0 0 24 24"><path d="M5 3v16l4.5-4.5 3 6 2.5-1.2-3-6H18Z" fill="var(--c-crust)" stroke="var(--c-text)" stroke-width="1.2" stroke-linejoin="round"/></svg></span>Escuro do tema</button>
            <button class="escolha" type="button" data-escolhe><span class="ponteiro"><svg viewBox="0 0 24 24"><path d="M5 3v16l4.5-4.5 3 6 2.5-1.2-3-6H18Z" fill="var(--accent)" stroke="var(--c-crust)" stroke-width="1.2" stroke-linejoin="round"/></svg></span>Na cor do destaque</button>
          </div>
        </div>
      </section>

      <section class="bloco">
        <header><h2>Áreas de trabalho <span class="q" data-porque="Cada área é uma mesa separada, com as janelas dela. O nome aparece na barra de cima."></span></h2><button class="bt pequeno" type="button" data-ic="criar">Dar nomes</button></header>
        <div class="corpo">
          <div class="areas"><span><b>1</b>sem nome</span><span><b>2</b>sem nome</span><span><b>3</b>sem nome</span><span><b>4</b>sem nome</span></div>
        </div>
      </section>
    </div>
  </div>
</main>

<footer id="rodape"></footer>
<script src="icones-meow.js"></script>
<script src="mockup.js"></script>
</body>
</html>
