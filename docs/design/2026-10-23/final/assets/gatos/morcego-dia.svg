<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Morcego dormindo (dia)">
  <title>morcego-dia — o morcego pendurado de cabeça para baixo, dormindo, símbolo de dia</title>
  <defs>
    <clipPath id="morcego-dia-disco">
      <circle cx="24" cy="24" r="23"/>
    </clipPath>
  </defs>

  <g clip-path="url(#morcego-dia-disco)">
    <!-- disco: lado claro da paleta -->
    <circle cx="24" cy="24" r="23" fill="#D6ACFF"/>

    <!-- manchas do disco, como no original: base clara com remendos um tom abaixo -->
    <g fill="#BD93F9">
      <path d="M-2 18c.2-7 4-13.4 9.8-17.2 4.4.4 7.8 2.8 8 6.2.2 4-3.6 7-8.6 8.6C3.6 16.8.4 18-2 18Z"/>
      <path d="M-2 28.6c4.8-2 9.6.2 11.4 4.4 1.8 4.2-.2 9.4-4.4 11C2 41.2-1 35.4-2 28.6Z"/>
      <path d="M12.8 50c1.2-5.2 6.4-8.8 12.4-8.4 5 .4 9 3.4 10.4 7.4l.4 1Z"/>
      <path d="M38 46.4c.4-5 5-9 11-9.4l1 12.6c-5 .4-9.6-1.2-12-3.2Z"/>
      <path d="M28.6-2.2c5.6-.2 10.8 1.6 14 5.2-2.8 3.2-8 4-12 2-3-1.6-3.8-4.6-2-7.2Z"/>
    </g>

    <!-- pernas, agarradas no galho -->
    <g fill="#191A21">
      <path d="M20.3 6h1.9l.5 6.8h-1.3Z"/>
      <path d="M27.7 6h-1.9l-.5 6.8h1.3Z"/>
    </g>

    <!-- galho na borda de cima do disco -->
    <path d="M-1 7.4c10-1.6 22-2.2 37.6-1.8 4.4.2 8.4.6 12.4 1.2v2.6c-4-.6-8-1-12.4-1.2-15.6-.4-27.6.2-37.6 1.8Z" fill="#191A21"/>

    <!-- cabeça de cabeça para baixo: orelhas grandes apontando para baixo -->
    <path d="M24 28.8C28.1 28.8 31.5 31.6 31.4 35.4 31.3 38.8 31.9 42.4 32.1 45.2 29.8 43.8 27.4 41.8 26.1 40.2 25.3 39.6 22.7 39.6 21.9 40.2 20.6 41.8 18.2 43.8 15.9 45.2 16.1 42.4 16.7 38.8 16.6 35.4 16.5 31.6 19.9 28.8 24 28.8Z" fill="#282A36"/>

    <!-- asas fechadas em volta do corpo, como uma capa -->
    <path d="M24 11c-4.8 0-8.4 2.8-10.2 7.2-1.2 3.2-1.8 6.8-2 11.4Q14.8 33.6 17.9 30.2Q20.9 34 24 30.8Q27.1 34 30.1 30.2Q33.2 33.6 36.2 29.6c-.2-4.6-.8-8.2-2-11.4C32.4 13.8 28.8 11 24 11Z" fill="#191A21"/>
    <!-- dobra da asa da frente, por cima da outra -->
    <path d="M25.8 12.2c-.6-.8-1.2-1.2-1.8-1.2-4.8 0-8.4 2.8-10.2 7.2-1.2 3.2-1.8 6.8-2 11.4Q14.8 33.6 17.9 30.2Q20.9 34 24 30.8c.8-4.8 1.4-11.8 1.8-18.6Z" fill="#21222C"/>

    <!-- olhos fechados -->
    <g fill="none" stroke="#D6ACFF" stroke-width="2" stroke-linecap="round">
      <path d="M19.4 35.4q1.9 2.6 3.8 0"/>
      <path d="M24.8 35.4q1.9 2.6 3.8 0"/>
    </g>
  </g>
</svg>
