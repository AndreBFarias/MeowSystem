# meow-oraculo-tema — o `ThemeBuilder::build()` do libcosmic, chamado de
# verdade.
#
# Os `scripts/derivar_*.py` são uma CÓPIA em Python da derivação do tema do
# libcosmic, feita sobre a revisão c003a58.
#
# Este arquivo é o molde; nunca é compilado no lugar.
[package]
name = "meow-oraculo-tema"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
cosmic-theme = { git = "https://github.com/pop-os/libcosmic", rev = "@REV@" }
cosmic-config = { git = "https://github.com/pop-os/libcosmic", rev = "@REV@", default-features = false, features = ["macro"] }
serde_json = "1"

[profile.release]
opt-level = 1
