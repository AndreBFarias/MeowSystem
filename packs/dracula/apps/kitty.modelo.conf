# meowsystem-tema: {{pack}}/{{flavor}}
# {{nome}} no kitty, montado pelo MeowSystem com a paleta do pack. Este arquivo
# é GERADO: a cor de cada linha sai do papel escrito no modelo
# (packs/<pack>/apps/kitty.modelo.conf), e mexer aqui dura até a próxima
# passagem do MeowSystem. O kitty.conf o lê por `include current-theme.conf`.
#
# A ordem das dezesseis cores é a do dracula/kitty (MIT): o "azul" do ANSI é o
# roxo, e o "preto" é o fundo mais escuro. Medido em 24/09/2026 contra o de lá:
# com o flavor `dracula`, 30 das 36 cores saem iguais. As seis que não têm slot
# na paleta — verde, amarelo, magenta e ciano brilhantes, o branco brilhante e
# o branco da seleção — caem no slot mais próximo.

foreground            {{text}}
background            {{base}}
selection_foreground  {{text}}
selection_background  {{surface1}}

url_color {{sky}}

# cursor: o bloco e o texto que ele cobre
cursor            {{text}}
cursor_text_color {{base}}

active_border_color   {{mauve}}
inactive_border_color {{overlay0}}
bell_border_color     {{red}}

active_tab_foreground    {{base}}
active_tab_background    {{text}}
active_tab_font_style    bold
inactive_tab_foreground  {{text}}
inactive_tab_background  {{overlay0}}
inactive_tab_font_style  normal

mark1_foreground {{base}}
mark1_background {{pink}}
mark2_foreground {{base}}
mark2_background {{green}}
mark3_foreground {{base}}
mark3_background {{mauve}}

# preto
color0  {{mantle}}
color8  {{overlay0}}
# vermelho
color1  {{red}}
color9  {{maroon}}
# verde
color2  {{green}}
color10 {{green}}
# amarelo
color3  {{yellow}}
color11 {{yellow}}
# azul (roxo no Dracula)
color4  {{mauve}}
color12 {{lavender}}
# magenta
color5  {{pink}}
color13 {{flamingo}}
# ciano
color6  {{sky}}
color14 {{sky}}
# branco
color7  {{text}}
color15 {{rosewater}}
