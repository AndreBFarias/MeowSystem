<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Ubuntu (container)">
  <title>Ubuntu (container) — caixa fechada com um shell dentro</title>

  <!-- alca da caixa -->
  <path d="M18,13 L18,10.6 Q18,6.8 24,6.8 Q30,6.8 30,10.6 L30,13" fill="none" stroke="#FFB86C" stroke-width="3.4" stroke-linejoin="round"/>

  <!-- corpo da caixa -->
  <rect x="4" y="11.5" width="40" height="31.5" rx="4" ry="4" fill="#FFB86C"/>

  <!-- travas da tampa -->
  <rect x="9.5" y="14.3" width="5.5" height="2.4" rx="1.2" ry="1.2" fill="#191A21"/>
  <rect x="33" y="14.3" width="5.5" height="2.4" rx="1.2" ry="1.2" fill="#191A21"/>

  <!-- tela do terminal embutida na face -->
  <rect x="8" y="19.5" width="32" height="19.5" rx="2" ry="2" fill="#191A21"/>

  <!-- prompt -->
  <path d="M15,24.2 L19.4,29.2 L15,34.2" fill="none" stroke="#50FA7B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="23" y="31.6" width="11" height="2.6" rx="1.3" ry="1.3" fill="#F8F8F2"/>
</svg>
