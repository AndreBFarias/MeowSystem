<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Universal Android Debloater">
  <title>Universal Android Debloater</title>

  <!-- corpo do telefone -->
  <rect x="5" y="4" width="24" height="40" rx="4.4" fill="#BD93F9"/>
  <rect x="14" y="5.6" width="6" height="1.2" rx="0.6" fill="#191A21"/>
  <rect x="13.5" y="40.3" width="7" height="1.4" rx="0.7" fill="#191A21"/>

  <!-- tela -->
  <rect x="7.3" y="8" width="19.4" height="30" rx="2.4" fill="#191A21"/>

  <!-- apps que ficam -->
  <rect x="8.75" y="9.9" width="6.8" height="6.8" rx="1.5" fill="#F8F8F2"/>
  <rect x="8.75" y="19.6" width="6.8" height="6.8" rx="1.5" fill="#F8F8F2"/>
  <rect x="18.45" y="19.6" width="6.8" height="6.8" rx="1.5" fill="#F8F8F2"/>
  <rect x="8.75" y="29.3" width="6.8" height="6.8" rx="1.5" fill="#F8F8F2"/>
  <rect x="18.45" y="29.3" width="6.8" height="6.8" rx="1.5" fill="#F8F8F2"/>

  <!-- vaga vazia deixada pelo app arrancado -->
  <rect x="18.95" y="10.4" width="5.8" height="5.8" rx="1.2" fill="none" stroke="#44475A" stroke-width="1"/>

  <!-- rastro -->
  <path d="M30.4 10.6H33.2M30.4 14.8H32.6" fill="none" stroke="#FF5555" stroke-opacity="0.5" stroke-width="1.2" stroke-linecap="round"/>

  <!-- app arrancado, saindo do telefone -->
  <rect x="35.7" y="8.7" width="7.6" height="7.6" rx="1.7" fill="#FF5555" transform="rotate(-20 39.5 12.5)"/>
</svg>
