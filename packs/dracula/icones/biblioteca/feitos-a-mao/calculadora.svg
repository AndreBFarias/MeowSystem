<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Ábaco de caveiras: disco cinza com aro vinho, moldura e hastes em branco (paleta Dracula). Desenhado em 1024 e reduzido por escala. -->
  <g transform="scale(0.125)">
    <!-- disco e aro -->
    <circle cx="511.5" cy="511.5" r="442.5" fill="#FF5555"/><circle cx="511.5" cy="511.5" r="442.5" fill="#21222C" fill-opacity="0.2"/><circle cx="511.5" cy="511.5" r="442.5" fill="#191A21" fill-opacity="0.7"/><circle cx="511.5" cy="511.5" r="407.5" fill="#F8F8F2"/><circle cx="511.5" cy="511.5" r="407.5" fill="#A4A6B8" fill-opacity="0.4"/><circle cx="511.5" cy="511.5" r="407.5" fill="#C8C8C2" fill-opacity="0.4"/>
    <!-- hastes horizontais -->
    <g stroke="#F8F8F2" stroke-width="12" stroke-linecap="butt">
      <path d="M347 350H678M347 450H678M347 548H678M347 648H678"/>
    </g>
    <!-- montantes e base -->
    <g fill="#C8C8C2" stroke="#F8F8F2" stroke-width="12" stroke-linejoin="round">
      <rect x="304" y="299" width="37" height="396"/>
      <rect x="684" y="299" width="33" height="396"/>
      <rect x="278" y="706" width="468" height="33"/>
    </g>
    <!-- caveira modelo centrada na cabeça -->
    <defs>
      <g id="k"><g transform="scale(0.85)">
        <path d="M0-40C-26-40-36-22-36-4C-36 10-30 18-22 22V36H22V22C30 18 36 10 36-4C36-22 26-40 0-40Z" fill="#F8F8F2"/>
        <path d="M0-30C-18-30-26-18-26-4C-26 6-22 12-14 15V26H14V15C22 12 26 6 26-4C26-18 18-30 0-30Z" fill="#C8C8C2"/>
        <circle cx="-12" cy="-6" r="7.5" fill="#F8F8F2"/>
        <circle cx="12" cy="-6" r="7.5" fill="#F8F8F2"/>
        <path d="M0 4L-5 14H5Z" fill="#F8F8F2"/>
      </g></g>
      <g id="b"><g transform="scale(0.9)">
        <rect x="-9" y="-32" width="18" height="64" fill="#F8F8F2"/>
        <circle cx="-11" cy="-34" r="13" fill="#F8F8F2"/><circle cx="11" cy="-34" r="13" fill="#F8F8F2"/>
        <circle cx="-11" cy="34" r="13" fill="#F8F8F2"/><circle cx="11" cy="34" r="13" fill="#F8F8F2"/>
        <circle cx="0" cy="-38" r="5" fill="#C8C8C2"/><circle cx="0" cy="38" r="5" fill="#C8C8C2"/>
      </g></g>
    </defs>
    <g>
      <use href="#k" x="487" y="352"/><use href="#k" x="565" y="352"/>
      <use href="#k" x="527" y="447"/><use href="#k" x="605" y="447"/><use href="#b" x="475" y="447"/>
      <use href="#k" x="402" y="548"/><use href="#k" x="548" y="548"/><use href="#k" x="607" y="548"/><use href="#b" x="475" y="548"/>
      <use href="#k" x="472" y="650"/><use href="#k" x="545" y="650"/>
    </g>
  </g>
</svg>
