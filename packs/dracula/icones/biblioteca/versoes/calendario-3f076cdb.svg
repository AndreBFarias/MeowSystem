<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Calendário lunar: disco amarelo com aro cinza e o ciclo das fases em runas. -->
  <g transform="scale(.125)" fill="none" stroke="#FBFDF4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="512" cy="512" r="464" fill="#494B4E" stroke="none"/>
    <circle cx="512" cy="512" r="436" fill="#F3E8A5" stroke="none"/>
    <!-- anel das fases -->
    <circle cx="512" cy="512" r="245"/>
    <!-- luas cheias: norte, sul, oeste, leste -->
    <circle cx="512" cy="244" r="54" fill="#F3E8A5"/>
    <circle cx="512" cy="780" r="54" fill="#F3E8A5"/>
    <circle cx="238" cy="512" r="54" fill="#F3E8A5"/>
    <circle cx="786" cy="512" r="54" fill="#F3E8A5"/>
