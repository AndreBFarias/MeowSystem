    <path d="M688 485H736L688 535H736M688 485V535M736 485V535"/>
    <path d="M420 668V712"/>
    <path d="M512 680L526 694L512 708L498 694Z"/>
    <path d="M600 712V664H612L620 674L612 685H600"/>
