    </radialGradient>
    <clipPath id="arco">
      <path id="forma" d="M82 678C130 600 170 500 200 400C230 300 260 215 300 100C330 50 380 18 440 18C500 18 550 60 580 110C600 160 640 260 680 380C720 490 760 600 787 672A426 426 0 0 1 725 745C650 650 600 570 550 490C520 460 480 447 435 447C390 447 340 470 300 520C270 560 240 620 200 690C180 720 160 735 145 748A426 426 0 0 1 82 678Z"/>
