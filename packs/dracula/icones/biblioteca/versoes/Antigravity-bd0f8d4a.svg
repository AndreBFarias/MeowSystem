      <stop offset="0" stop-color="#F9A620"/><stop offset="1" stop-color="#F9A620" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ve" gradientUnits="userSpaceOnUse" cx="250" cy="200" r="210">
      <stop offset="0" stop-color="#8BC34A"/><stop offset="1" stop-color="#8BC34A" stop-opacity="0"/>
