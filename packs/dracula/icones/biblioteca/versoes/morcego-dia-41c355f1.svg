<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Morcego dormindo (dia)">
  <title>morcego-dia — o morcego pendurado de cabeça para baixo, dormindo, símbolo de dia</title>
  <defs>
    <clipPath id="morcego-dia-disco">
      <circle cx="24" cy="24" r="23"/>
    </clipPath>
  </defs>

  <g clip-path="url(#morcego-dia-disco)">
    <!-- disco: lado claro da paleta -->
    <circle cx="24" cy="24" r="23" fill="#D6ACFF"/>

    <!-- manchas do disco, como no original (base clara, manchas um tom abaixo) -->
    <g fill="#BD93F9">
      <path d="M-1 16C1 9 6 3 13 0c4 2 5 7 2 11-3 4-10 7-16 5Z"/>
      <path d="M-2 28c5-2 10 0 12 4s0 9-4 10c-5-3-8-8-8-14Z"/>
      <path d="M15 50c1-6 7-9 13-7 4 1.4 6.4 4 7 7Z"/>
      <path d="M40 44c2-4 6-7 10-7v10c-4 0-8-1-10-3Z"/>
      <path d="M30-1c5-1 10 1 13 5-3 3-9 3-12 0Z"/>
    </g>

    <!-- galho: a borda de cima do disco de onde ele se pendura -->
    <rect x="6" y="7.2" width="36" height="2.4" rx="1.2" fill="#21222C"/>

    <!-- pés agarrados no galho -->
    <g fill="none" stroke="#21222C" stroke-width="1.9" stroke-linecap="round">
      <path d="M21 12.4V7.6c0-1.3-1.2-1.8-2-1"/>
      <path d="M27 12.4V7.6c0-1.3 1.2-1.8 2-1"/>
    </g>

    <!-- cabeça, de cabeça para baixo: orelhas apontando para baixo -->
    <g fill="#44475A">
      <path d="M18.6 36.2c-2 2.2-3.2 4.8-3.6 6.8 2.6-1 5-2.8 6.6-5Z"/>
      <path d="M29.4 36.2c2 2.2 3.2 4.8 3.6 6.8-2.6-1-5-2.8-6.6-5Z"/>
      <path d="M24 26c4.2 0 7.6 2.6 8.2 6.4.6 3.6-1 6.8-4 8.4-2.8 1.4-5.6 1.4-8.4 0-3-1.6-4.6-4.8-4-8.4.6-3.8 4-6.4 8.2-6.4Z"/>
    </g>

    <!-- asas fechadas em volta do corpo, capa com barra recortada -->
    <path d="M24 11.4c-3.8 0-6.8 2.4-8.4 6-1.5 3.4-2.2 7.6-1.8 11.8q2.6 3.8 5.1 1.1q2.5 3.3 5.1.3q2.6 3 5.1-.3q2.5 2.7 5.1-1.1c.4-4.2-.3-8.4-1.8-11.8-1.6-3.6-4.6-6-8.4-6Z" fill="#21222C"/>
    <!-- dobra da asa da frente -->
    <path d="M24 11.4c-3.8 0-6.8 2.4-8.4 6-1.5 3.4-2.2 7.6-1.8 11.8q2.6 3.8 5.1 1.1q2.5 3.3 5.1.3Z" fill="#282A36"/>

    <!-- focinho -->
    <path d="M22.7 30.4c.9-.5 1.7-.5 2.6 0 0 1.4-.6 2.2-1.3 2.2s-1.3-.8-1.3-2.2Z" fill="#21222C"/>

    <!-- olhos fechados -->
    <g fill="none" stroke="#D6ACFF" stroke-width="1.7" stroke-linecap="round">
      <path d="M18.4 33.6q2.2 2.6 4.4 0"/>
      <path d="M25.2 33.6q2.2 2.6 4.4 0"/>
    </g>
  </g>
</svg>
