  <!-- PILHA DE DUAS FOLHAS, e a silhueta e que carrega a leitura — 16/09/2026
       A primeira tentativa (folha + esquadro) foi reprovada por um motivo que
       nao era estetico: "a pagina branca lisa e quase o mesmo pixel-blob de
       folder-documents; a 24px os dois viram a mesma coisa, e o usuario nao
       distingue Documentos de Modelos no menu". A correcao tinha de mudar o
       CONTORNO, nao o preenchimento — duas folhas sobrepostas contra uma folha
       resolve, marca interna nao (some a 24px).
       Da folha de tras so aparece o "L" roxo de 3.5u (1.75px a 24px), que e o
       que diz "mais de uma". O roxo fica sobre o CORPO da pasta (3.41:1) e
       nunca sobre o branco, onde daria 2.26:1 e sumiria. -->
  <path fill="#BD93F9" d="M 20.3,20.5 L 32.2,20.5 A 0.8,0.8 0 0 1 33,21.3 L 33,33.2 L 20.3,33.2 Z"/>
  <path fill="#F8F8F2" d="M 15.8,24.8 L 28.7,24.8 A 0.8,0.8 0 0 1 29.5,25.6 L 29.5,37.2 A 0.8,0.8 0 0 1 28.7,38 L 15.8,38 A 0.8,0.8 0 0 1 15,37.2 L 15,25.6 A 0.8,0.8 0 0 1 15.8,24.8 Z"/>
</svg>
