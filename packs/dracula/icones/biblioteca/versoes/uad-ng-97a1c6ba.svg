<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Universal Android Debloater">
  <title>Universal Android Debloater</title>

  <!-- corpo do telefone -->
  <rect x="6.5" y="4" width="25" height="40" rx="4.5" fill="#BD93F9"/>
  <rect x="16" y="5.6" width="6" height="1.2" rx="0.6" fill="#191A21"/>
  <rect x="15.5" y="40.3" width="7" height="1.4" rx="0.7" fill="#191A21"/>

  <!-- tela -->
  <rect x="9" y="8" width="20" height="30" rx="2.5" fill="#191A21"/>

  <!-- apps que ficam -->
  <rect x="10.5" y="9.5" width="7" height="7" rx="1.6" fill="#F8F8F2"/>
  <rect x="10.5" y="19.5" width="7" height="7" rx="1.6" fill="#F8F8F2"/>
  <rect x="20.5" y="19.5" width="7" height="7" rx="1.6" fill="#F8F8F2"/>
  <rect x="10.5" y="29.5" width="7" height="7" rx="1.6" fill="#F8F8F2"/>
  <rect x="20.5" y="29.5" width="7" height="7" rx="1.6" fill="#F8F8F2"/>

  <!-- vaga vazia deixada pelo app arrancado -->
  <rect x="20.95" y="9.95" width="6.1" height="6.1" rx="1.3" fill="none" stroke="#44475A" stroke-width="0.9"/>

  <!-- app saindo fora -->
  <rect x="35.75" y="8.25" width="7.5" height="7.5" rx="1.7" fill="#FF5555" transform="rotate(-20 39.5 12)"/>
</svg>
