<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Universal Android Debloater">
  <title>uad-ng — resgatado do PNG</title>
  <defs>
    <linearGradient id="uad-ng-aro" gradientUnits="userSpaceOnUse" x1="7.85" y1="7.89" x2="40.06" y2="40.11">
      <stop offset="0" stop-color="#d18be9"/>
      <stop offset="0.5" stop-color="#fb7dc8"/>
      <stop offset="1" stop-color="#acc9ed"/>
    </linearGradient>
    <radialGradient id="uad-ng-fundo" gradientUnits="userSpaceOnUse" cx="24" cy="16.88" r="30">
      <stop offset="0" stop-color="#414456"/>
      <stop offset="0.25" stop-color="#393c4c"/>
      <stop offset="0.3" stop-color="#383a4a"/>
      <stop offset="0.39" stop-color="#343645"/>
      <stop offset="0.44" stop-color="#313442"/>
      <stop offset="0.49" stop-color="#303341"/>
      <stop offset="0.55" stop-color="#2e303e"/>
      <stop offset="0.58" stop-color="#2c2f3c"/>
      <stop offset="0.65" stop-color="#2a2c38"/>
      <stop offset="0.74" stop-color="#262834"/>
      <stop offset="0.78" stop-color="#262833"/>
      <stop offset="0.85" stop-color="#242630"/>
      <stop offset="0.89" stop-color="#23242f"/>
      <stop offset="0.96" stop-color="#21222c"/>
      <stop offset="1" stop-color="#20212b"/>
    </radialGradient>
    <linearGradient id="uad-ng-verde" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#69ff94"/>
      <stop offset="1" stop-color="#52fa7c"/>
    </linearGradient>
    <filter id="uad-ng-halo" x="-30%" y="-25%" width="160%" height="150%">
      <feGaussianBlur stdDeviation="0.56"/>
    </filter>
    <filter id="uad-ng-faisca" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="0.28"/>
    </filter>
    <g id="uad-ng-droide" fill="url(#uad-ng-verde)">
      <path d="M16.5 24.09A7.45 7.45 0 0 1 31.41 24.09Z"/>
      <path d="M17.34 15L19.41 18.66" fill="none" stroke="url(#uad-ng-verde)" stroke-width="1.22" stroke-linecap="round"/>
      <path d="M30.56 15L28.5 18.66" fill="none" stroke="url(#uad-ng-verde)" stroke-width="1.22" stroke-linecap="round"/>
      <rect x="16.5" y="25.03" width="14.91" height="11.34" rx="2.06"/>
      <rect x="13.69" y="25.41" width="1.97" height="8.91" rx="0.98"/>
      <rect x="32.25" y="25.41" width="1.97" height="8.91" rx="0.98"/>
      <rect x="19.31" y="34.88" width="1.97" height="5.72" rx="0.98"/>
      <rect x="26.63" y="34.88" width="1.97" height="5.72" rx="0.98"/>
    </g>
    <g id="uad-ng-brilhos">
      <path d="M33.7 12.19Q33.7 14.02 35.01 14.02Q33.7 14.02 33.7 15.85Q33.7 14.02 32.39 14.02Q33.7 14.02 33.7 12.19Z" fill="#f1fa8c"/>
      <path d="M14.02 27.38Q14.02 28.08 14.72 28.08Q14.02 28.08 14.02 28.78Q14.02 28.08 13.32 28.08Q14.02 28.08 14.02 27.38Z" fill="#8be9fd"/>
      <path d="M34.83 29.16Q34.83 29.77 35.44 29.77Q34.83 29.77 34.83 30.38Q34.83 29.77 34.22 29.77Q34.83 29.77 34.83 29.16Z" fill="#ff79c6"/>
    </g>
  </defs>

  <!-- disco escuro, claro em cima e fundo embaixo -->
  <circle cx="24" cy="24" r="22.03" fill="url(#uad-ng-fundo)"/>

  <!-- halo verde rente ao droide -->
  <use href="#uad-ng-droide" filter="url(#uad-ng-halo)"/>

  <!-- fio de luz por dentro do aro -->
  <circle cx="24" cy="24" r="20.87" fill="none" stroke="#b9c5f0" stroke-opacity="0.1" stroke-width="0.3"/>

  <!-- o droide -->
  <use href="#uad-ng-droide"/>
  <circle cx="21.14" cy="21.75" r="1.03" fill="#262a35"/>
  <circle cx="26.77" cy="21.75" r="1.03" fill="#262a35"/>

  <!-- faíscas -->
  <use href="#uad-ng-brilhos" opacity="0.75" filter="url(#uad-ng-faisca)"/>
  <use href="#uad-ng-brilhos"/>

  <!-- aro de fora -->
  <circle cx="24" cy="24" r="22.88" fill="none" stroke="url(#uad-ng-aro)" stroke-width="1.69"/>
</svg>
