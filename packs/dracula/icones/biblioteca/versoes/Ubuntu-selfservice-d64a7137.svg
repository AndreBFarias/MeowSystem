<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Área de trabalho remota">
  <title>Ubuntu-selfservice — a tela de outra máquina, à distância</title>

  <!-- máquina local: monitor, pé e base -->
  <rect x="20.00" y="32.50" width="8.00" height="6.00" fill="#565a72"/>
  <rect x="12.00" y="38.00" width="24.00" height="4.00" rx="2.00" fill="#565a72"/>
  <rect x="2.50" y="5.00" width="43.00" height="29.50" rx="3.50" fill="#565a72"/>
  <rect x="5.50" y="8.00" width="37.00" height="23.50" rx="1.50" fill="#191a21"/>

  <!-- o enlace: sinal chegando do canto da tela -->
  <g fill="none" stroke="#62d6e8" stroke-width="1.80" stroke-linecap="round">
    <path d="M13.50,28.00 A4.50,4.50 0 0 0 9.00,23.50"/>
    <path d="M17.00,28.00 A8.00,8.00 0 0 0 9.00,20.00"/>
    <path d="M20.50,28.00 A11.50,11.50 0 0 0 9.00,16.50"/>
  </g>
  <circle cx="9.00" cy="28.00" r="1.40" fill="#62d6e8"/>

  <!-- máquina remota: a tela de lá, dentro da tela de cá -->
  <g fill="#bd93f9">
    <rect x="18.00" y="10.50" width="21.00" height="12.00" rx="2.00"/>
    <rect x="26.50" y="22.50" width="4.00" height="2.00"/>
    <rect x="22.00" y="24.50" width="13.00" height="2.20" rx="1.10"/>
  </g>

  <!-- sessão viva -->
  <circle cx="40.00" cy="33.00" r="0.90" fill="#50fa7b"/>
</svg>
